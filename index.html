<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steps English Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div>
            <div class="brand-name">Steps English</div>
            <div class="brand-subtitle">Discovery demo</div>
          </div>
        </div>

        <nav id="nav" class="nav"></nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <div id="pageEyebrow" class="eyebrow">Student journey</div>
            <h1 id="pageTitle">Steps English</h1>
            <p id="pageSubtitle">
              English grows naturally through stories, songs, play, speaking, and review.
            </p>
          </div>
          <div class="topbar-actions">
            <select id="roleSelect" class="role-select" aria-label="Select view">
              <option value="student">Student View</option>
              <option value="admin">Teacher/Admin View</option>
            </select>
            <button id="resetDemo" class="ghost-btn">Reset Demo</button>
          </div>
        </header>

        <div class="topbar-metrics" id="topbarMetrics"></div>
        <section id="content" class="content"></section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
